<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>全脑仿真 · Dr. Dezeming</title>
  <meta name="description" content="从果蝇大脑到数字心智，全脑仿真的入门与理论">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    :root {
      --theme-color: #2f5d72;
      --base-font-family: "Source Han Serif SC", "Noto Serif CJK SC", Georgia, "Songti SC", serif;
      --content-max-width: 780px;
    }
    .sidebar { font-family: "Source Han Sans SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; }
    .cover { background: linear-gradient(160deg, #0b1a2b 0%, #17384f 55%, #2f5d72 100%); }
    .cover .cover-main > p:first-child a { font-size: 3rem; letter-spacing: 0.08em; }
    .cover .cover-main blockquote p { color: rgba(255,255,255,0.85); }
    .cover .cover-main .cover-read,
    .cover .cover-main .cover-download {
      display: inline-block; margin: 0.4rem 0.35rem; padding: 0.55rem 1.4rem;
      border-radius: 999px; font-size: 0.95rem; text-decoration: none;
    }
    .cover .cover-main .cover-read { background: #ffffff; color: #17384f; }
    .cover .cover-main .cover-download { border: 1px solid rgba(255,255,255,0.7); color: #fff; }
    .markdown-section { line-height: 1.85; }
    .markdown-section h1 { font-size: 1.9rem; }
    .markdown-section h2 { margin-top: 2.2rem; }
    .markdown-section img { display: block; margin: 1rem auto; max-width: 100%; }
    .markdown-section table { display: table; width: 100%; }
    .markdown-section blockquote { border-left: 3px solid var(--theme-color); background: #f6f8f9; padding: 0.4rem 1rem; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: '全脑仿真',
      repo: '',
      loadSidebar: true,
      coverpage: true,
      subMaxLevel: 2,
      maxLevel: 3,
      homepage: 'README.md',
      relativePath: true,
      search: {
        placeholder: '搜索',
        noData: '没有找到内容',
        depth: 3
      },
      pagination: {
        previousText: '上一章',
        nextText: '下一章',
        crossChapter: true
      },
      copyCode: {
        buttonText: '复制',
        errorText: '复制失败',
        successText: '已复制'
      },
      plugins: [
        function (hook) {
          hook.beforeEach(function (md) {
            var route = decodeURI(location.hash.replace(/^#\/?/, '').split('?')[0]);
            if (!route || /\/$/.test(route)) { route += 'README.md'; }
            var dir = route.replace(/[^\/]*$/, '');
            function normalize(base, p) {
              var stack = base.split('/').filter(Boolean);
              p.split('/').forEach(function (seg) {
                if (seg === '..') { stack.pop(); }
                else if (seg !== '.' && seg !== '') { stack.push(seg); }
              });
              return '/' + stack.join('/');
            }
            md = md.replace(/(!\[[^\]]*\]\()([^)\s]+)(\))/g, function (all, pre, src, post) {
              if (/^[a-zA-Z]+:\/\//.test(src) || src.charAt(0) === '/') { return all; }
              return pre + normalize(dir, src) + post;
            });
            md = md.replace(/(<img[^>]+src=["'])([^"']+)(["'])/g, function (all, pre, src, post) {
              if (/^[a-zA-Z]+:\/\//.test(src) || src.charAt(0) === '/') { return all; }
              return pre + normalize(dir, src) + post;
            });
            return md;
          });
        }
      ]
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination@2/dist/docsify-pagination.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-katex@1/dist/docsify-katex.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-mermaid@2/dist/docsify-mermaid.js"></script>
</body>
</html>
